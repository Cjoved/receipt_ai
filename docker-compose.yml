services:
  postgres:
    image: postgres:16
    container_name: receipt_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: receipt_ai
      POSTGRES_USER: receipt_ai
      POSTGRES_PASSWORD: receipt_ai_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: receipt_ai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
